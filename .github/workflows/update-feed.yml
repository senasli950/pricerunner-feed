name: Update GTIN Feed

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GTIN feed repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate GTIN feeds
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          python generate_feed.py

      - name: Checkout main feed repository
        uses: actions/checkout@v4
        with:
          repository: senasli950/trovaprezzy-feed
          token: ${{ secrets.OLD_REPO_TOKEN }}
          path: old-feed

      - name: Copy GTIN feeds to main feed repository
        run: |
          cp feed-en.xml old-feed/feed-en.xml
          cp feed-it.xml old-feed/feed-it.xml
          cp feed-fr.xml old-feed/feed-fr.xml

      - name: Commit and push GTIN feeds
        working-directory: old-feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed-en.xml feed-it.xml feed-fr.xml

          git diff --cached --quiet || git commit -m "Update GTIN feeds"

          git push
